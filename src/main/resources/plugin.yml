name: BowsersBigBlast
version: '1.0.0.0'
main: io.github.derec4.bowsersBigBlast.BowsersBigBlast
api-version: '1.20'
prefix: DerexXD
authors: [ DerexXD ]
description: Engine for Bowser's Big Blast Minigame made for CheapPickle
website: https://www.youtube.com/@CheapPickle/shorts
commands:
  bbtest:
    description: Test/debug commands for Bowser's Big Blast
    usage: /bbtest <testCelebration|revealDetonator>
    permission: bowsersbigblast.bbtest
    permission-message: You do not have permission to use this command.
  bowsergame:
    description: Start or stop Bowser's Big Blast minigame
    usage: /bowsergame <number|stop>
    permission: bowsersbigblast.start
    permission-message: You do not have permission to start or stop the game.
  bowserreload:
    description: Reload Bowser's Big Blast config
    usage: /bowserreload
    permission: bowsersbigblast.reload
    permission-message: You do not have permission to reload the config.
